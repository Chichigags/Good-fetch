<style>
:root{--bg:#fbfbf8;--ink:#0a0a0a;--muted:#5d5d58;--line:#d9d9d4;--soft:#f0efeb;--max:1320px}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
a{color:inherit;text-decoration:none} button{font:inherit}
.shell{width:min(calc(100% - 56px),var(--max));margin:auto}
header{min-height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;flex-direction:column;gap:2px} .brand strong{font-size:30px;line-height:1;font-weight:900;letter-spacing:-.05em} .tagline{font-size:12px;color:var(--muted)}
nav{display:flex;align-items:center;gap:26px;font-size:15px} nav a.active{border-bottom:2px solid;padding-bottom:6px} .langs{display:flex;gap:8px;align-items:center} .langs button{border:0;background:transparent;padding:7px 10px;cursor:pointer;border-radius:999px} .langs .active{background:#111;color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:0}
.main{padding-right:30px;border-right:1px solid var(--line)} .side{padding-left:26px}
.hero{display:flex;justify-content:flex-end;align-items:center;padding:34px 0 26px;min-height:250px}
.hero-visual{display:grid;grid-template-columns:minmax(160px,240px) minmax(0,1fr);align-items:center;gap:18px;width:100%;max-width:720px}
.riva-hero{display:block;width:100%;max-width:240px;justify-self:end;mix-blend-mode:multiply} .riva-hero img{display:block;width:100%;height:auto}
.riva-note{font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-size:17px;line-height:1.45;font-style:italic;transform:rotate(-2deg);transform-origin:left center;margin:0;color:#171717;white-space:pre-line}
.section-title{display:flex;justify-content:space-between;align-items:end;border-top:1px solid var(--line);padding-top:22px;margin-top:18px} .section-title h2{font-size:25px;margin:0;letter-spacing:-.03em} .count{font-size:12px;color:var(--muted)}
.story{display:grid;grid-template-columns:48px 210px minmax(0,1fr);gap:18px;padding:24px 0;border-bottom:1px solid var(--line);min-width:0} .num{font-size:52px;font-weight:900;line-height:1} .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:5px;background:#ddd} .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px} .story h3{font-size:24px;line-height:1.02;letter-spacing:-.035em;margin:0 0 8px;overflow-wrap:break-word} .summary{font-size:16px;line-height:1.35;color:#3f3f3c;margin:0 0 12px;overflow-wrap:break-word} .why{background:var(--soft);border-radius:8px;padding:11px 12px;font-size:14px;line-height:1.35} .why b{display:block;margin-bottom:3px} .story-copy{min-width:0}
.intro-card{margin-top:28px;background:#f3f1ea;border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px} .intro-card h3{font-family:Georgia,serif;font-size:26px;font-weight:500;margin:0 0 8px;line-height:1.3;overflow-wrap:anywhere} .intro-card .rec-why{margin:0;font-size:16px;line-height:1.5;color:#1c1c1a} .intro-card .rec-meta{margin:10px 0 0;font-size:14px;line-height:1.55;color:#3f3f3c;overflow-wrap:break-word}
.archive{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)} .archive h3{font-size:26px;margin:0 0 14px} .archive button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer} .archive button[hidden]{display:none} .archive button.active{background:var(--soft)} .archive .view{font-weight:700;margin-top:6px}
.about-card{margin-top:34px;padding:20px 0 34px;border-top:1px solid var(--line);font-size:13px;line-height:1.5;color:var(--muted)}
footer{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px 20px;padding:24px 0 40px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.masthead{border-top:1px solid var(--line);padding-top:22px;margin-top:18px}
.masthead h2{font-size:25px;margin:0;letter-spacing:-.03em;line-height:1.15}
.masthead p{margin:8px 0 0;font-size:15px;color:var(--muted)}
.subhead{font-size:16px;line-height:1.3;letter-spacing:-.02em;margin:16px 0 6px}
.sources{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:16px;max-width:100%;min-width:0}
.sources-heading{margin:0;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;line-height:1.4;color:#3f3f3c}
.source-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;max-width:100%;min-width:0;margin:0}
.sources .source{display:inline;margin:0;max-width:100%;font-size:13px;font-weight:600;line-height:1.45;color:#1c1c1a;overflow-wrap:anywhere}
.source-tag{font-size:12px;font-weight:600;line-height:1.4;color:#3f3f3c}
.more-details{margin:2px 0 2px}
.more-details summary{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:13px;line-height:1.35;font-weight:500;color:var(--muted);cursor:pointer;list-style:none}
.more-details summary::-webkit-details-marker{display:none}
.more-details summary::marker{content:''}
.more-details summary::before{content:'';flex:0 0 auto;width:0;height:0;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;border-left:5px solid currentColor;transform-origin:center}
.more-details[open] summary::before{transform:rotate(90deg)}
.more-details summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.more-details .summary{margin-top:10px}
.more-details .summary:last-child{margin-bottom:0}
.why .take-kind{display:block;margin:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kicker-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;margin:0 0 8px}
.kicker-row .kicker{margin:0}
.update-note{margin:0 0 10px;font-size:14px;line-height:1.45;font-style:italic;color:var(--muted);overflow-wrap:break-word}
.riva-closing{margin:32px auto 8px;max-width:34em;padding:0 12px;text-align:center;font-size:15px;line-height:1.55;font-style:italic;color:#3f3f3c;overflow-wrap:break-word}
.riva-closing .sign{display:block;margin-top:2px;font-family:"Bradley Hand","Segoe Print","Comic Sans MS",cursive;font-size:18px;line-height:1.2;font-style:italic;color:#171717}
.story h3{line-height:1.2}
.story.no-thumb{grid-template-columns:48px minmax(0,1fr)}
.intro-card .rec-label{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1.3;color:#3f3f3c}
.load-note{margin:22px 0 36px;padding:16px 18px;background:var(--soft);border-radius:12px;color:#3f3f3c;font-size:15px;line-height:1.45}
.archive .note{margin:0;padding:10px 12px;font-size:14px;line-height:1.4;color:var(--muted)}
@media(max-width:900px){.grid{grid-template-columns:1fr} .main{border-right:0;padding-right:0} .side{padding-left:0} .hero{justify-content:flex-start;min-height:0} .hero-visual{max-width:100%;grid-template-columns:minmax(140px,200px) minmax(0,1fr)} .riva-hero{justify-self:start;max-width:200px} .story{grid-template-columns:40px 120px minmax(0,1fr)} .story.no-thumb{grid-template-columns:40px minmax(0,1fr)} nav a{display:none}}
@media(max-width:620px){.shell{width:min(calc(100% - 28px),var(--max))} header{min-height:70px} .brand strong{font-size:26px} .tagline{max-width:none} .masthead h2{font-size:22px} .hero-visual{grid-template-columns:1fr;gap:8px} .riva-hero{max-width:180px} .riva-note{font-size:16px} .story,.story.no-thumb{grid-template-columns:34px 1fr} .thumb{grid-column:2} .story-copy{grid-column:2} .num{font-size:40px}}
html[lang="zh-CN"] body{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif}
html[lang="zh-CN"] .summary{line-height:1.75;margin-bottom:1em}
html[lang="zh-CN"] .update-note,html[lang="zh-CN"] .riva-closing{line-height:1.75}
html[lang="zh-CN"] .why{line-height:1.75}
html[lang="zh-CN"] .story h3{font-size:22px;line-height:1.4;letter-spacing:0}
html[lang="zh-CN"] .masthead h2{font-size:22px;line-height:1.45;letter-spacing:0}
html[lang="zh-CN"] .subhead{line-height:1.45;letter-spacing:0}
html[lang="zh-CN"] .kicker,html[lang="zh-CN"] .sources-heading,html[lang="zh-CN"] .intro-card .rec-label{letter-spacing:0;text-transform:none}
html[lang="zh-CN"] .sources-heading,html[lang="zh-CN"] .intro-card .rec-label{font-size:13px}
html[lang="zh-CN"] .intro-card h3{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:22px;line-height:1.4;font-weight:700}
html[lang="zh-CN"] .intro-card .rec-why,html[lang="zh-CN"] .intro-card .rec-meta{line-height:1.75}
@media(max-width:620px){html[lang="zh-CN"] .story h3{font-size:20px;line-height:1.4} html[lang="zh-CN"] .masthead h2,html[lang="zh-CN"] .intro-card h3{font-size:20px;line-height:1.4}}
body.archive-bottom .grid{grid-template-columns:minmax(0,1fr)}
body.archive-bottom .main{border-right:0;padding-right:0}
body.archive-bottom .side{padding:0}
body.archive-bottom .hero{justify-content:flex-start}
body.archive-bottom .archive h3{font-size:18px}
</style>

<body>
<div class="shell">
<header>
  <a class="brand" href="#top"><strong>Good Fetch</strong><span class="tagline" data-i18n="tagline">A dog’s take on AI, from Asia.</span></a>
  <nav>
    <a class="active" href="#top" data-i18n="home">Home</a>
    <div class="langs"><button type="button" class="active" data-lang="en">EN</button><button type="button" data-lang="zh">中文</button></div>
  </nav>
</header>

<div class="grid" id="top">
<main class="main">
  <section class="hero">
    <div class="hero-visual"><picture class="riva-hero"><source srcset="riva-good-fetch.webp" type="image/webp"><img src="riva-good-fetch.png" alt="Riva, a cream Cavapoo, holding a rolled newspaper that reads Good Fetch, I fetched this for you."></picture><p class="riva-note" data-i18n="rivaNote">Hi, I’m Riva. I fetch your daily news,
with my human and an AI agent helping out.
I make mistakes sometimes. I’m a dog, after all.
Come back tomorrow.</p></div>
  </section>
  <div id="stories">
    <p class="load-note" data-i18n="loading">Loading today's edition…</p>
  </div>
  <noscript><p class="load-note">Good Fetch needs JavaScript to load today's edition.</p></noscript>
</main>

<aside class="side">
  <section class="archive">
    <h3 data-i18n="archive">Archive</h3>
    <div id="archive-list"></div>
    <button class="view" type="button" id="view-all" data-i18n="viewAll" hidden>View all →</button>
  </section>
</aside>
</div>
<footer><span>Good Fetch · 2026</span><span data-i18n="footer">Fetched by Riva &amp; Cassie’s AI agent.</span></footer>
</div>
<script>
const ui = {
  en: {
    tagline: 'A dog’s take on AI, from Asia.',
    home: 'Home',
    briefing: 'Daily News Briefing',
    myTake: "Riva's Take",
    analysis: 'Analysis',
    rivaNote: "Hi, I’m Riva. I fetch your daily news,\nwith my human and an AI agent helping out.\nI make mistakes sometimes. I’m a dog, after all.\nCome back tomorrow.",
    archive: 'Archive',
    viewAll: 'View all →',
    footer: 'Fetched by Riva & Cassie’s AI agent.',
    loading: "Loading today's edition…",
    loadError: "Today's edition couldn't be loaded. Please refresh in a moment.",
    missingEdition: "This edition isn't available yet.",
    archiveError: "Archive couldn't be loaded.",
    empty: 'This edition has no stories yet.',
    sourceFallback: 'Source',
    sourcesHeading: 'Sources',
    official: 'Official',
    downloadFile: 'Download {type} file',
    moreDetails: 'More details',
    update: 'Update'
  },
  zh: {
    tagline: '一只狗，在亚洲看 AI',
    home: '首页',
    briefing: '每日新闻简报',
    myTake: 'Riva 的看法',
    analysis: '分析',
    rivaNote: 'Hi，我是 Riva。我每天替你搜罗新闻，我的铲屎官和她的 AI 智能体会帮我打下手。偶尔会出错，毕竟我只是一只狗。明天见。',
    archive: '往期',
    viewAll: '查看全部 →',
    footer: '由 Riva 和 Cassie 的 AI 智能体为你精心制作。',
    loading: '正在加载今天的内容…',
    loadError: '今天的内容暂时没加载出来，请稍后再刷新。',
    missingEdition: '这一期还没有发布。',
    archiveError: '往期列表暂时没加载出来。',
    empty: '这一期还没有新闻。',
    sourceFallback: '来源',
    sourcesHeading: '来源',
    official: '官方',
    downloadFile: '下载 {type} 文件',
    moreDetails: '更多细节',
    update: '更新'
  }
};

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
let lang = 'en';
let editions = [];
let archiveFailed = false;
let archiveExpanded = false;
let activeDate = '';
let currentEdition = null;
let messageKey = '';
let requestId = 0;

function isIsoDate(value) {
  return /^\d{4}-\d{2}-\d{2}$/.test(value || '');
}

function formatDate(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!match) return '';
  const month = MONTHS[Number(match[2]) - 1];
  if (!month) return '';
  return month + ' ' + Number(match[3]) + ', ' + match[1];
}

function formatLongDate(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!match) return '';
  const month = MONTHS_LONG[Number(match[2]) - 1];
  if (!month) return '';
  return month + ' ' + Number(match[3]) + ', ' + match[1];
}

function formatChineseDate(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!match) return '';
  return match[1] + ' 年 ' + Number(match[2]) + ' 月 ' + Number(match[3]) + ' 日';
}

function editionHeader(date) {
  if (lang === 'zh') {
    const label = formatChineseDate(date);
    return label ? 'GOOD FETCH｜' + label : 'GOOD FETCH';
  }
  const label = formatLongDate(date);
  return label ? 'GOOD FETCH | ' + label : 'GOOD FETCH';
}

function clean(value) {
  return typeof value === 'string' ? value.trim() : '';
}

function localizedString(obj, key) {
  if (!obj || typeof obj !== 'object') return '';
  if (lang === 'zh') {
    const zh = clean(obj[key + 'Zh']);
    if (zh) return zh;
  }
  return clean(obj[key]);
}

function paragraphList(value) {
  if (typeof value === 'string') {
    const text = value.trim();
    return text ? [text] : [];
  }
  if (!Array.isArray(value)) return [];
  return value.filter(item => typeof item === 'string' && item.trim()).map(item => item.trim());
}

function localizedParagraphs(obj, key) {
  if (!obj || typeof obj !== 'object') return [];
  if (lang === 'zh') {
    const zh = paragraphList(obj[key + 'Zh']);
    if (zh.length) return zh;
  }
  return paragraphList(obj[key]);
}

function firstString(obj, keys) {
  for (const key of keys) {
    const value = localizedString(obj, key);
    if (value) return value;
  }
  return '';
}

function firstParagraphs(obj, keys) {
  for (const key of keys) {
    const value = localizedParagraphs(obj, key);
    if (value.length) return value;
  }
  return [];
}

function takeBody(text) {
  return text.replace(/^My Take:\s*/, '').replace(/^我的看法[:：]\s*/, '');
}

function safeUrl(url) {
  if (typeof url !== 'string' || !url.trim()) return '';
  try {
    const parsed = new URL(url, window.location.href);
    if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return parsed.href;
  } catch (error) {}
  return '';
}

function sourceList(value) {
  if (!Array.isArray(value)) return [];
  const links = [];
  value.forEach(item => {
    if (!item || typeof item !== 'object') return;
    const url = safeUrl(item.url);
    if (!url) return;
    links.push({
      name: localizedString(item, 'name'),
      url,
      official: item.official === true,
      download: clean(item.download)
    });
  });
  return links;
}

function renderSources(parent, sources) {
  const links = sourceList(sources);
  if (!links.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'sources';
  const heading = document.createElement('p');
  heading.className = 'sources-heading';
  heading.textContent = ui[lang].sourcesHeading;
  wrap.append(heading);
  links.forEach(link => {
    const row = document.createElement('p');
    row.className = 'source-row';
    const a = document.createElement('a');
    a.className = 'source';
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = (link.name || ui[lang].sourceFallback) + ' →';
    row.append(a);
    if (link.official) {
      const tag = document.createElement('span');
      tag.className = 'source-tag';
      tag.textContent = ui[lang].official;
      row.append(tag);
    }
    if (link.download) {
      const file = document.createElement('span');
      file.className = 'source-tag';
      file.textContent = ui[lang].downloadFile.replace('{type}', link.download);
      row.append(file);
    }
    wrap.append(row);
  });
  parent.append(wrap);
}

function paragraph(text) {
  const el = document.createElement('p');
  el.className = 'summary';
  el.textContent = text;
  return el;
}

function renderStory(parent, item, number) {
  if (!item || typeof item !== 'object') return false;
  const headline = localizedString(item, 'headline');
  const category = localizedString(item, 'category');
  const opening = firstParagraphs(item, ['opening', 'intro']);
  const sections = Array.isArray(item.sections) ? item.sections : [];
  const myTake = takeBody(localizedString(item, 'myTake'));
  const detailLines = localizedParagraphs(item, 'details');
  const sectionBlocks = sections.filter(section => {
    if (!section || typeof section !== 'object') return false;
    return firstString(section, ['heading', 'question']) || localizedParagraphs(section, 'paragraphs').length;
  });
  if (!headline && !opening.length && !sectionBlocks.length && !myTake && !detailLines.length) return false;

  const article = document.createElement('article');
  article.className = 'story';
  const num = document.createElement('div');
  num.className = 'num';
  num.textContent = String(number);
  const imageUrl = safeUrl(item.image || '');
  if (!imageUrl) article.classList.add('no-thumb');

  const copy = document.createElement('div');
  copy.className = 'story-copy';
  const updateNote = localizedString(item, 'updateNote');
  if (item.update === true) {
    const row = document.createElement('div');
    row.className = 'kicker-row';
    if (category) {
      const kicker = document.createElement('p');
      kicker.className = 'kicker';
      kicker.textContent = category;
      row.append(kicker);
    }
    const tag = document.createElement('p');
    tag.className = 'kicker update-tag';
    tag.textContent = ui[lang].update;
    row.append(tag);
    copy.append(row);
  } else if (category) {
    const kicker = document.createElement('p');
    kicker.className = 'kicker';
    kicker.textContent = category;
    copy.append(kicker);
  }
  if (headline) {
    const h3 = document.createElement('h3');
    h3.textContent = headline;
    copy.append(h3);
  }
  if (updateNote) {
    const note = document.createElement('p');
    note.className = 'update-note';
    note.textContent = updateNote;
    copy.append(note);
  }
  opening.forEach(text => copy.append(paragraph(text)));
  sectionBlocks.forEach(section => {
    const heading = firstString(section, ['heading', 'question']);
    const paras = localizedParagraphs(section, 'paragraphs');
    if (heading) {
      const h4 = document.createElement('h4');
      h4.className = 'subhead';
      h4.textContent = heading;
      copy.append(h4);
    }
    paras.forEach(text => copy.append(paragraph(text)));
  });
  if (myTake) {
    const why = document.createElement('div');
    why.className = 'why';
    const label = document.createElement('b');
    label.textContent = ui[lang].myTake;
    const kind = document.createElement('span');
    kind.className = 'take-kind';
    kind.textContent = ui[lang].analysis;
    const span = document.createElement('span');
    span.textContent = myTake;
    why.append(label, kind, span);
    copy.append(why);
  }
  if (detailLines.length) {
    const details = document.createElement('details');
    details.className = 'more-details';
    const summary = document.createElement('summary');
    summary.textContent = ui[lang].moreDetails;
    details.append(summary);
    detailLines.forEach(text => details.append(paragraph(text)));
    copy.append(details);
  }
  renderSources(copy, item.sources);

  article.append(num);
  if (imageUrl) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = imageUrl;
    img.alt = clean(item.imageAlt);
    article.append(img);
  }
  article.append(copy);
  parent.append(article);
  return true;
}

function renderStoryList(parent, stories, start) {
  const list = Array.isArray(stories) ? stories : [];
  let number = start;
  list.forEach(item => {
    if (renderStory(parent, item, number)) number += 1;
  });
  return number;
}

function renderRecommendation(parent, rec) {
  if (!rec || typeof rec !== 'object') return false;
  const title = localizedString(rec, 'title');
  const text = localizedString(rec, 'text');
  const price = localizedString(rec, 'price');
  const availability = localizedString(rec, 'availability');
  const note = localizedString(rec, 'note');
  const href = safeUrl(rec.link || rec.url || '');
  if (!title && !text && !price && !availability && !note) return false;
  const card = document.createElement('section');
  card.className = 'intro-card';
  const kicker = document.createElement('p');
  kicker.className = 'rec-label';
  kicker.textContent = lang === 'zh' ? (clean(rec.labelZh) || '值得一看') : (clean(rec.label) || 'Worth a look');
  card.append(kicker);
  if (title) {
    const h3 = document.createElement('h3');
    if (href) {
      const a = document.createElement('a');
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = title;
      h3.append(a);
    } else {
      h3.textContent = title;
    }
    card.append(h3);
  }
  if (text) {
    const body = document.createElement('p');
    body.className = 'rec-why';
    body.textContent = text;
    card.append(body);
  }
  [price, availability, note].forEach(line => {
    if (!line) return;
    const meta = document.createElement('p');
    meta.className = 'rec-meta';
    meta.textContent = line;
    card.append(meta);
  });
  parent.append(card);
  return true;
}

function renderClosing(parent, edition) {
  const text = localizedString(edition, 'closing');
  if (!text) return;
  const line = document.createElement('p');
  line.className = 'riva-closing';
  line.append(document.createTextNode(text));
  const sign = document.createElement('span');
  sign.className = 'sign';
  sign.textContent = 'Riva';
  line.append(sign);
  parent.append(line);
}

function renderEdition(edition) {
  currentEdition = edition;
  messageKey = '';
  document.title = editionHeader(edition.date);
  const root = document.getElementById('stories');
  root.replaceChildren();

  const mast = document.createElement('div');
  mast.className = 'masthead';
  const h2 = document.createElement('h2');
  h2.textContent = editionHeader(edition.date);
  const sub = document.createElement('p');
  sub.textContent = ui[lang].briefing;
  mast.append(h2, sub);
  root.append(mast);

  let number = renderStoryList(root, edition.stories, 1);
  if (edition.region && typeof edition.region === 'object') {
    number = renderStoryList(root, edition.region.stories, number);
  }
  const hasRecommendation = renderRecommendation(root, edition.recommendation);
  if (number === 1 && !hasRecommendation) {
    const note = document.createElement('p');
    note.className = 'load-note';
    note.textContent = ui[lang].empty;
    root.append(note);
  }
  renderClosing(root, edition);
}

function showMessage(key) {
  currentEdition = null;
  messageKey = key;
  document.title = 'Good Fetch';
  const root = document.getElementById('stories');
  const note = document.createElement('p');
  note.className = 'load-note';
  note.textContent = ui[lang][key] || ui[lang].loadError;
  root.replaceChildren(note);
}

function renderStories() {
  if (currentEdition) renderEdition(currentEdition);
  else if (messageKey) showMessage(messageKey);
}

function placeArchive() {
  const aside = document.querySelector('.side');
  const grid = document.querySelector('.grid');
  const footer = document.querySelector('footer');
  if (!aside || !grid || !footer) return;
  const few = editions.length < 5;
  document.body.classList.toggle('archive-bottom', few);
  if (few) footer.before(aside);
  else grid.append(aside);
}

function renderArchive() {
  const list = document.getElementById('archive-list');
  const view = document.getElementById('view-all');
  list.replaceChildren();
  placeArchive();
  if (archiveFailed) {
    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = ui[lang].archiveError;
    list.append(note);
    view.hidden = true;
    return;
  }
  const visible = archiveExpanded ? editions : editions.slice(0, 5);
  visible.forEach(item => {
    const button = document.createElement('button');
    button.type = 'button';
    const custom = clean(item.label);
    button.textContent = lang === 'zh' ? (formatChineseDate(item.date) || formatDate(item.date)) : (custom || formatDate(item.date));
    if (item.date === activeDate) {
      button.classList.add('active');
      button.setAttribute('aria-current', 'date');
    }
    button.addEventListener('click', () => openEdition(item.date));
    list.append(button);
  });
  view.hidden = editions.length <= 5;
  view.textContent = ui[lang].viewAll;
}

async function fetchJson(path) {
  const response = await fetch(path, { cache: 'no-store' });
  if (!response.ok) {
    const error = new Error('HTTP ' + response.status);
    error.status = response.status;
    throw error;
  }
  return response.json();
}

async function openEdition(date) {
  if (!isIsoDate(date)) return;
  const myId = ++requestId;
  activeDate = date;
  renderArchive();
  try {
    const edition = await fetchJson('news/' + date + '.json');
    if (myId !== requestId) return;
    if (!edition || typeof edition !== 'object' || Array.isArray(edition)) throw new Error('bad edition');
    renderEdition(edition);
  } catch (error) {
    if (myId !== requestId) return;
    showMessage(error.status === 404 ? 'missingEdition' : 'loadError');
  }
}

function setLang(next) {
  lang = next === 'zh' ? 'zh' : 'en';
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  document.querySelectorAll('[data-lang]').forEach(button => {
    button.classList.toggle('active', button.dataset.lang === lang);
  });
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (ui[lang][key]) el.textContent = ui[lang][key];
  });
  renderStories();
  renderArchive();
}

async function boot() {
  const myId = ++requestId;
  try {
    const index = await fetchJson('news/index.json');
    const list = index && Array.isArray(index.editions) ? index.editions : [];
    editions = list.filter(item => item && isIsoDate(item.date));
    archiveFailed = false;
  } catch (error) {
    editions = [];
    archiveFailed = true;
  }
  renderArchive();
  try {
    const edition = await fetchJson('news/latest.json');
    if (myId !== requestId) return;
    if (!edition || typeof edition !== 'object' || Array.isArray(edition)) throw new Error('bad edition');
    activeDate = isIsoDate(edition.date) ? edition.date : '';
    renderEdition(edition);
    renderArchive();
  } catch (error) {
    if (myId !== requestId) return;
    showMessage('loadError');
  }
}

document.querySelectorAll('[data-lang]').forEach(button => {
  button.addEventListener('click', () => setLang(button.dataset.lang));
});
document.getElementById('view-all').addEventListener('click', () => {
  archiveExpanded = true;
  renderArchive();
});
boot();
</script>
</body>
</html>
